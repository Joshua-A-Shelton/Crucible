# Hosted CI: build, both test suites, format checks.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: 23.1.3
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install build tools
        # Window system headers for Slag's X11/XCB/Wayland paths; Clang and
        # libclang for the binding generator (ADR 0017) and NativeAOT's link.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libclang-dev libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --no-tests=error

  windows:
    name: Windows (MSVC, ${{ matrix.preset }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --no-tests=error

  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check C++ formatting
        run: find src/native tests/native \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 clang-format --dry-run --Werror

      # dotnet format analyzes the engine project, which compiles the
      # generated bindings, so generate them first.
      - name: Generate bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libclang-dev libx11-dev libx11-xcb-dev libxcb1-dev libxext-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev
          cmake --preset debug -DCRUCIBLE_BUILD_AOT=OFF
          cmake --build --preset debug --target crucible_bindings

      - name: Check C# formatting
        run: dotnet format Crucible.slnx --verify-no-changes
